[package]
name = "rift-bot"
version = "0.1.0"
edition = "2024"
description = "Write a bot for Rift in Rust: commands, replies, live panels, DMs, and voice"
license = "Apache-2.0"
repository = "https://github.com/awais-amjed/rift-bot-sdk-rust"
homepage = "https://joinrift.app"
keywords = ["rift", "bot", "chat", "voice"]
categories = ["api-bindings"]
exclude = ["third_party"]

[features]
# A call's media, through LiveKit's Rust SDK and the WebRTC library it
# downloads. Off by default: a bot that answers `/echo` should not build a
# WebRTC stack it never loads, and most bots are that bot.
voice = [
    "dep:livekit",
    "dep:libwebrtc",
    "dep:webrtc-sys",
    "dep:livekit-common",
    "dep:livekit-data-stream",
    "dep:livekit-protocol",
    "dep:livekit-rpc",
    "dep:livekit-signaling",
]

[dependencies]
# Our copy, which says a two-channel track is stereo (third_party/livekit/
# RIFT_PATCHES.md). A path, not [patch.crates-io], which would not reach the
# bots that depend on this crate.
livekit = { path = "third_party/livekit", optional = true, features = ["rustls-tls-native-roots"] }
# Held at the versions livekit 0.9.1 was published against. Its manifest asks
# for them with `^`, and later patch releases of these do not build with it:
# without the pins, a bot's first build fails inside third_party.
libwebrtc = { version = "=0.3.48", optional = true }
webrtc-sys = { version = "=0.3.45", optional = true }
livekit-common = { version = "=0.1.3", optional = true }
livekit-data-stream = { version = "=0.1.5", optional = true }
livekit-protocol = { version = "=0.7.13", optional = true }
livekit-rpc = { version = "=0.1.1", optional = true }
livekit-signaling = { version = "=0.1.2", optional = true }
aes-gcm = "0.11.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
base64 = "0.23.1"
livekit-api = { version = "=0.7.1", default-features = false, features = ["access-token"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
