[package]
name = "rift-bot"
version = "0.1.0"
edition = "2024"
description = "Write a bot for Rift in Rust: commands, replies, live panels, DMs, and voice"
license = "Apache-2.0"
repository = "https://github.com/awais-amjed/rift-bot-sdk-rust"
homepage = "https://joinrift.app"
keywords = ["rift", "bot", "chat", "voice"]
categories = ["api-bindings"]
exclude = ["third_party"]

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
